  - {id: retention, topic: retention,            text: "30 daily copies plus 12 monthly copies"}
  - {id: rpo_rto,   topic: recovery targets,     text: "RPO 24 hours, RTO 8 hours"}
  - {id: encrypt,   topic: security,             text: "encryption at rest and in transit"}
  - {id: restore,   topic: testing,              text: "quarterly restore test with a report"}
  - {id: budget,      topic: budget,              text: "budget is SAR 90,000"}
data_contents: "Odoo holds customer personal data (names, phone numbers, addresses, invoices)."
stance: Requires hosting inside Saudi Arabia.
